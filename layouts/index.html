{{ define "head" }}
<style>
main { padding-bottom: 0 !important; }
body { background-color: black; }
</style>
{{ end }}

{{ define "header" }}
<header>
  <div class="{{ .Site.Params.background_color_class | compare.Default "bg-black" }}">
    {{ partials.Include "site-navigation.html" . }}
  </div>
</header>
{{ end }}

{{ define "main" }}
{{ with .Params.image }}
<img src="{{ . }}" class="w-100 db" alt="">
{{ end }}
{{ end }}
